<svg viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Helvetica, Arial, sans-serif">
<title>Layout-Skizze Letter Tetris, Hochformat (v1)</title>
<desc>Handy im Hochformat: vollflächiger Hintergrund, darüber ein schwebendes, oben offenes Spielfeld mit Rändern, unten ein Infobereich.</desc>
<rect x="0" y="0" width="680" height="700" fill="#FFFFFF"/>
<rect x="40" y="20" width="300" height="650" rx="28" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="190" y="52" text-anchor="middle" font-size="12" fill="#5F5E5A">Hintergrundbild (vollflächig)</text>
<rect x="76" y="96" width="240" height="480" rx="4" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<g stroke="#B4B2A9" stroke-width="0.5" opacity="0.6">
<line x1="94" y1="90" x2="94" y2="570"/><line x1="118" y1="90" x2="118" y2="570"/><line x1="142" y1="90" x2="142" y2="570"/><line x1="166" y1="90" x2="166" y2="570"/><line x1="190" y1="90" x2="190" y2="570"/><line x1="214" y1="90" x2="214" y2="570"/><line x1="238" y1="90" x2="238" y2="570"/><line x1="262" y1="90" x2="262" y2="570"/><line x1="286" y1="90" x2="286" y2="570"/>
<line x1="70" y1="138" x2="310" y2="138"/><line x1="70" y1="186" x2="310" y2="186"/><line x1="70" y1="234" x2="310" y2="234"/><line x1="70" y1="282" x2="310" y2="282"/><line x1="70" y1="330" x2="310" y2="330"/><line x1="70" y1="378" x2="310" y2="378"/><line x1="70" y1="426" x2="310" y2="426"/><line x1="70" y1="474" x2="310" y2="474"/><line x1="70" y1="522" x2="310" y2="522"/>
</g>
<path d="M70 90 L70 570 L310 570 L310 90" fill="none" stroke="#534AB7" stroke-width="3" stroke-linejoin="round"/>
<text x="190" y="84" text-anchor="middle" font-size="12" fill="#5F5E5A">offen</text>
<rect x="70" y="594" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="190" y="617" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Infobereich</text>
<text x="190" y="636" text-anchor="middle" font-size="12" fill="#534AB7">Highscore, Punkte …</text>
<line x1="40" y1="330" x2="70" y2="330" stroke="#888780" stroke-width="1"/>
<text x="55" y="322" text-anchor="middle" font-size="11" fill="#5F5E5A">Rand</text>
<g font-size="14" fill="#2C2C2A">
<line x1="345" y1="70" x2="375" y2="70" stroke="#888780" stroke-width="1"/>
<text x="385" y="66">Hintergrundbild</text>
<text x="385" y="84" font-size="12" fill="#5F5E5A">füllt den ganzen Screen</text>
<line x1="315" y1="200" x2="375" y2="200" stroke="#534AB7" stroke-width="1"/>
<text x="385" y="196">Spielfeld, schwebend</text>
<text x="385" y="214" font-size="12" fill="#5F5E5A">oben offen, mit Tiefe</text>
<text x="385" y="232" font-size="12" fill="#5F5E5A">Platzhalter: 10 × 20 Felder</text>
<line x1="320" y1="574" x2="375" y2="574" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text x="385" y="570">Gestrichelt: Schatten</text>
<text x="385" y="588" font-size="12" fill="#5F5E5A">deutet das Schweben an</text>
<line x1="315" y1="622" x2="375" y2="622" stroke="#534AB7" stroke-width="1"/>
<text x="385" y="618">Infobereich unten</text>
<text x="385" y="636" font-size="12" fill="#5F5E5A">Inhalt noch offen</text>
</g>
</svg>
